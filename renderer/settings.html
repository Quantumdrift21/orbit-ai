<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Orbit AI – Settings</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 22px 24px;
        background: #12121a;
        color: #e8e8f0;
        font:
          13.5px/1.45 'Segoe UI Variable',
          'Segoe UI',
          'Nirmala UI',
          system-ui,
          sans-serif;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p.sub {
        margin: 0 0 18px;
        color: #9a9ab0;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      input,
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        background: #1c1c28;
        color: #fff;
        border: 1px solid #2e2e40;
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: #7a6bff;
      }
      textarea {
        height: 92px;
        resize: none;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row input {
        flex: 1;
      }
      .hint {
        color: #8a8aa0;
        font-size: 12px;
        margin-top: 4px;
      }
      a {
        color: #9d8cff;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 22px;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 8px 16px;
        font: inherit;
        cursor: pointer;
        background: #2a2a3a;
        color: #fff;
      }
      button.primary {
        background: linear-gradient(135deg, #6a5cff, #00b8ff);
        font-weight: 600;
      }
      .row select {
        flex: 1;
      }
      .meter {
        height: 6px;
        margin-top: 8px;
        border-radius: 3px;
        background: #1c1c28;
        overflow: hidden;
      }
      #meterFill {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #00e5a0, #00b8ff);
        transition: width 80ms linear;
      }
      #micHint.bad {
        color: #ffb84d;
      }
      #msg {
        margin-right: auto;
        align-self: center;
        color: #7dffcf;
        font-size: 12.5px;
      }
      #msg.warn {
        color: #ffb84d;
      }
    </style>
  </head>
  <body>
    <h1>Orbit AI settings</h1>
    <p class="sub">Your key is stored encrypted on this PC only.</p>

    <label for="apiKey">Gemini API key</label>
    <div class="row">
      <input id="apiKey" type="password" placeholder="Paste your key" autocomplete="off" spellcheck="false" />
      <button id="reveal" type="button">Show</button>
    </div>
    <div class="hint">
      Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>
    </div>

    <label for="model">Model</label>
    <input id="model" list="models" spellcheck="false" />
    <datalist id="models">
      <option value="gemini-3.8-live"></option>
      <option value="gemini-3.8-live-extended-thinking"></option>
      <option value="gemini-3.1-flash-live-preview"></option>
      <option value="gemini-2.5-flash-native-audio-preview-12-2025"></option>
    </datalist>

    <label for="voice">Voice</label>
    <select id="voice">
      <option>Puck</option>
      <option>Charon</option>
      <option>Kore</option>
      <option>Fenrir</option>
      <option>Aoede</option>
      <option>Leda</option>
      <option>Orus</option>
      <option>Zephyr</option>
      <option>Callirrhoe</option>
      <option>Autonoe</option>
      <option>Enceladus</option>
      <option>Iapetus</option>
      <option>Umbriel</option>
      <option>Algieba</option>
      <option>Despina</option>
      <option>Erinome</option>
      <option>Algenib</option>
      <option>Rasalgethi</option>
      <option>Laomedeia</option>
      <option>Achernar</option>
      <option>Alnilam</option>
      <option>Schedar</option>
      <option>Gacrux</option>
      <option>Pulcherrima</option>
      <option>Achird</option>
      <option>Zubenelgenubi</option>
      <option>Vindemiatrix</option>
      <option>Sadachbia</option>
      <option>Sadaltager</option>
      <option>Sulafat</option>
    </select>

    <label for="language">Language</label>
    <select id="language">
      <option value="auto">English + Tamil (reply in the language I speak)</option>
      <option value="en">English only</option>
      <option value="ta">Tamil only (தமிழ்)</option>
    </select>

    <label for="micLabel">Microphone</label>
    <select id="micLabel">
      <option value="">Windows default</option>
    </select>
    <div class="meter"><div id="meterFill"></div></div>
    <div class="hint" id="micHint">Speak – the bar should move. If it stays empty, pick another mic.</div>

    <label for="speakerLabel">Speaker</label>
    <div class="row">
      <select id="speakerLabel">
        <option value="">Windows default</option>
      </select>
      <button id="testSpeaker" type="button">Test</button>
    </div>

    <label for="hotkey">Talk hotkey</label>
    <input id="hotkey" spellcheck="false" />
    <div class="hint">Electron format, e.g. <code>Control+Space</code>, <code>Alt+O</code>, <code>F9</code></div>

    <label for="systemPrompt">Personality / instructions</label>
    <textarea id="systemPrompt"></textarea>

    <div class="actions">
      <span id="msg"></span>
      <button id="cancel" type="button">Close</button>
      <button id="save" type="button" class="primary">Save</button>
    </div>

    <script src="settings.js"></script>
  </body>
</html>
