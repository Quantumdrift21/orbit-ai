<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Orbit – subtitle</title>
    <style>
      :root {
        --accent: 56, 217, 255; /* set per alert: done / needs you / error / agents */
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
      }
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        padding: 0 18px;
      }
      .stage.right {
        justify-content: flex-start;
      }
      .stage.left {
        justify-content: flex-end;
      }
      .bubble {
        position: relative;
        max-width: 288px;
        padding: 11px 15px 13px;
        border-radius: 18px;
        color: #eef1f8;
        background:
          radial-gradient(120% 90% at 0% 0%, rgba(var(--accent), 0.16), transparent 55%),
          linear-gradient(160deg, rgba(26, 28, 44, 0.96), rgba(11, 12, 21, 0.96));
        border: 1px solid rgba(var(--accent), 0.55);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.07),
          0 10px 28px rgba(0, 0, 0, 0.45),
          0 0 26px rgba(var(--accent), 0.22);
        opacity: 0;
        transform: translateY(6px) scale(0.92);
        transition:
          opacity 0.22s ease,
          transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .bubble.show {
        opacity: 1;
        transform: none;
      }
      /* a thin light sweeping across the top edge while it speaks */
      .bubble::before {
        content: '';
        position: absolute;
        left: 16px;
        right: 16px;
        top: -1px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(var(--accent), 0.95), transparent);
        background-size: 50% 100%;
        background-repeat: no-repeat;
        animation: sweep 2.2s linear infinite;
      }
      @keyframes sweep {
        from {
          background-position: -60% 0;
        }
        to {
          background-position: 160% 0;
        }
      }
      /* tail pointing at the robot */
      .tail {
        position: absolute;
        top: 50%;
        width: 14px;
        height: 14px;
        margin-top: -7px;
        background: rgb(20, 22, 35);
        border: 1px solid rgba(var(--accent), 0.55);
        transform: rotate(45deg);
      }
      .left .tail {
        right: -8px;
        border-left: 0;
        border-bottom: 0;
      }
      .right .tail {
        left: -8px;
        border-right: 0;
        border-top: 0;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 5px;
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px 2px 6px;
        border-radius: 999px;
        background: rgba(var(--accent), 0.14);
        color: rgb(var(--accent));
        font-weight: 600;
        text-transform: uppercase;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgb(var(--accent));
        box-shadow: 0 0 8px rgb(var(--accent));
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(0.6);
          opacity: 0.6;
        }
      }
      .project {
        color: #8d93a8;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .text {
        font-size: 14px;
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .detail {
        margin-top: 7px;
        padding: 5px 8px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        font:
          11.5px/1.4 Consolas,
          'Cascadia Mono',
          monospace;
        color: #c9cede;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 9px;
        align-items: center;
      }
      .actions:empty {
        display: none;
      }
      .actions button {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 9px;
        padding: 5px 11px;
        font:
          600 12px 'Segoe UI Variable Text',
          'Segoe UI',
          sans-serif;
        color: #eef1f8;
        background: rgba(255, 255, 255, 0.07);
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .actions button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .actions button:active {
        transform: scale(0.96);
      }
      .actions .allow {
        background: rgba(31, 143, 95, 0.9);
        border-color: rgba(61, 255, 168, 0.4);
      }
      .actions .deny {
        background: rgba(168, 58, 69, 0.9);
        border-color: rgba(255, 77, 94, 0.4);
      }
      .actions .chat {
        margin-left: auto;
        color: rgb(var(--accent));
        border-color: rgba(var(--accent), 0.45);
        background: rgba(var(--accent), 0.1);
      }
      .count {
        font-size: 11px;
        color: #8d93a8;
        margin-left: auto;
      }
      /* each word arrives as it's spoken */
      .w {
        display: inline-block;
        opacity: 0;
        filter: blur(3px);
        transform: translateY(4px);
        animation: word 0.32s ease forwards;
        white-space: pre;
      }
      @keyframes word {
        to {
          opacity: 1;
          filter: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="bubble" id="bubble">
        <div class="tail"></div>
        <div class="head">
          <span class="chip"><span class="dot"></span><span id="who"></span></span>
          <span class="project" id="project"></span>
          <span class="count" id="count"></span>
        </div>
        <div class="text" id="text"></div>
        <div class="detail" id="detail" hidden></div>
        <div class="actions" id="actions"></div>
      </div>
    </div>
    <script src="bubble.js"></script>
  </body>
</html>
