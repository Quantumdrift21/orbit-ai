<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Orbit – Claude asks</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #12121a;
        color: #e8e8f0;
        font:
          13px/1.4 'Segoe UI Variable',
          'Segoe UI',
          system-ui,
          sans-serif;
        user-select: none;
      }
      .card {
        box-sizing: border-box;
        height: 100%;
        padding: 12px 14px;
        border: 1px solid #3a3a52;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        color: #9a9ab0;
        font-size: 12px;
      }
      #title {
        font-weight: 600;
        font-size: 14px;
      }
      #detail {
        font-family: Consolas, 'Cascadia Mono', monospace;
        font-size: 12px;
        background: #1c1c28;
        border-radius: 6px;
        padding: 5px 7px;
        /* the whole command, wrapped (agent-watch.js keeps it to 3 lines, or marks it partial) */
        white-space: normal;
        word-break: break-all;
        overflow: hidden;
      }
      [hidden] {
        display: none;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: auto;
      }
      button {
        flex: 1;
        border: 0;
        border-radius: 7px;
        padding: 7px 0;
        font: inherit;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        background: #2a2a3a;
      }
      #allow {
        background: #1f8f5f;
      }
      #deny {
        background: #a83a45;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top"><span id="project"></span><span id="count"></span></div>
      <div id="title"></div>
      <div id="detail"></div>
      <div class="actions">
        <button id="allow" type="button">Allow</button>
        <button id="deny" type="button">Deny</button>
        <button id="terminal" type="button" title="Answer in Claude Code instead">Use terminal</button>
      </div>
    </div>
    <script src="approve.js"></script>
  </body>
</html>
